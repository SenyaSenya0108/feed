services:
  db:
    container_name: db
    image: postgres:latest
    ports:
      - "5434:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST: ${DB_HOSTNAME:-dev}
      POSTGRES_DB: ${DB_NAME:-dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev}
      POSTGRES_USER: ${DB_USER:-dev}

  cli:
    container_name: cli
    build:
      context: .
      dockerfile: docker/cli/Dockerfile
    depends_on:
      - db
    restart: unless-stopped
    environment:
      DB_URL: "postgres://user:password@postgres:5432/feeds?sslmode=disable"

volumes:
  postgres-data:
